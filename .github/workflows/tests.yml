name: Tests
on:
  push:
    branches: [main, stable, "feat/**"]
  pull_request:
    branches: [main, stable]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[redis-migration]" pytest
      - name: Run tests
        env:
          APP_ENV: development
          TOKEN_SALT: ci-test-secret-not-for-production
          TMDB_API_KEY: ci-placeholder-tmdb-key
        run: PYTHONPATH=. pytest -q
